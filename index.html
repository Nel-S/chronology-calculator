<!doctype html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<!-- <link rel="icon" type="image/svg+xml" href="/favicon.svg" /> -->
	<link rel="icon" type="image/png" href="/blank.png" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Chronology Calculator</title>
	<meta property="og:title" content="Chronology Calculator">
	<meta property="og:description"
		content="Given a list of timestamped entries, finds the latest entries matching some metadata as of a particular date.">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link
		href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
		rel="stylesheet">
</head>

<body>

	<noscript>
		<div>
			<p>This page is dynamic, and therefore unfortunately requires JavaScript to function.</p>
		</div>
	</noscript>

	<div class="page">
		<div>
			<h1 class="title">Chronology Calculator</h1>
		</div>

		<ul class="input-box">
			<li class="narrow-rounded-box input-entry">
				<label class="label" for="list-form">List:</label>
				<select id="list-form">
					<option selected disabled hidden>[No list selected.]</option>
					<optgroup label="Schema Examples">
						<option>Minimal Example</option>
						<option>Comprehensive Example</option>
					</optgroup>
					<optgroup label="Minecraft Releases">
						<option>Java Edition</option>
						<option>Xbox 360 Edition</option>
					</optgroup>
					<optgroup label="Custom" id="custom-lists">
						<option>From URL</option>
						<option>From File Upload</option>
					</optgroup>
				</select>
				<input type="url" id="list-form-url" placeholder="URL..." class="hidden">
				<!-- TODO: Figure out how to center -->
				<input type="file" id="list-form-file-upload" accept=".json,.JSON" class="hidden">
			</li>
			<li class="translucent narrow-rounded-box input-entry" inert>
				<label class="label" for="datetime-form">Date:</label>
				<input type="datetime-local" id="datetime-form" onclick="this.showPicker()">
			</li>
			<li class="translucent narrow-rounded-box input-entry" inert>
				<label class="label" for="utc-offset-form">UTC Offset:</label>
				<input type="range" min="-12" max="14" step="0.25" id="utc-offset-form">
				<p class="subtext" id="current-utc-offset"></p>
			</li>
		</ul>

		<div class="rounded-box output-box" id="output-container">
			<div class="list-name">
				[Waiting for list selection.]
			</div>
		</div>

		<div>
			<p class="subtext" id="list-last-updated"></p>
		</div>
	</div>
	<div class="about smaller-label">
		<p>This tool uses harmonizations of multiple sources. It may contain errors; please file <a
				href="https://github.com/Nel-S/latest-version-calculator/issues">an Issue</a> if so.</p>
		<p>Thank you to <a href="https://github.com/Moresteck">Moresteck</a>, <a
				href="https://github.com/fanda857">fanda857</a>, and <a
				href="https://omniarchive.uk/">Omniarchive</a>'s/<a href="https://minecraft.wiki/">the Minecraft
				Wiki</a>'s contributors for making this possible.</p>
	</div>

	<script type="module" src="/src/main.ts"></script>
</body>

</html>
